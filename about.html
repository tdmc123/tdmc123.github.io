<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于 · 铜锭的博客</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            background: #f6f5f4;
            color: #1c1c1e;
            line-height: 1.8;
            padding: 20px;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px 48px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.05);
            border: 1px solid #e6e4e2;
        }

        .back-link {
            display: inline-block;
            margin-top: 28px;
            color: #007aff;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 i {
            color: #007aff;
        }

        .subtitle {
            color: #6e6e73;
            font-size: 1.05rem;
            margin-bottom: 24px;
            border-bottom: 1px solid #e6e4e2;
            padding-bottom: 16px;
        }

        .about-content p {
            margin-bottom: 14px;
            font-size: 1.05rem;
        }

        .about-content strong {
            color: #007aff;
        }

        .about-content ul {
            list-style: none;
            padding: 0;
            margin: 16px 0 20px;
        }

        .about-content ul li {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .about-content ul li i {
            color: #007aff;
            width: 24px;
            text-align: center;
        }

        .footer-note {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #e6e4e2;
            color: #6e6e73;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .footer-note a {
            color: #007aff;
            text-decoration: none;
        }

        .footer-note a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .container {
                padding: 28px 20px;
            }
            h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1><i class="fas fa-info-circle"></i> 关于本站</h1>
        <div class="subtitle">铜锭的个人博客 · 始于 2026</div>

        <div class="about-content">
            <p>📝 这里是 <strong>铜锭（tdmc）</strong> 的个人博客，记录编程、算法、生活和思考。</p>
            <p>💻 主要内容方向：</p>
            <ul>
                <li><i class="fas fa-code"></i> 技术分享（前端、后端、架构）</li>
                <li><i class="fas fa-brain"></i> 算法刷题与竞赛经验</li>
                <li><i class="fas fa-server"></i> OJ 搭建与运维实践</li>
                <li><i class="fas fa-book"></i> 读书笔记与书评</li>
                <li><i class="fas fa-coffee"></i> 生活随笔与感悟</li>
            </ul>
            <p>—— 用文字沉淀思考，用代码改变世界。</p>
        </div>

        <div class="footer-note">
            <span><i class="far fa-copyright"></i> 2026 铜锭</span>
            <span><a href="https://beian.miit.gov.cn/" target="_blank">无备案</a></span>
            <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> 返回博客首页</a>
        </div>
    </div>
</body>
</html>
