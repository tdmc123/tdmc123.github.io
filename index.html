<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>铜锭的博客</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root { --bg:#121212; --card:#1e1e1e; --border:#333; --text:#e4e4e4; --muted:#aaa; --accent:#4a9eff; --accent-hover:#6aafff; --radius:20px; --shadow:0 8px 28px rgba(0,0,0,0.6); }
        body { font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text); line-height:1.6; padding:0 20px; }
        .container { max-width:1200px; margin:0 auto; padding:20px 0 40px; }
        .site-header { display:flex; justify-content:space-between; align-items:center; padding:24px 0 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:12px; }
        .logo { font-size:1.9rem; font-weight:700; background:linear-gradient(135deg,#4a9eff,#7a6eff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .logo i { -webkit-text-fill-color:initial; color:var(--accent); margin-right:4px; }
        .nav-links { display:flex; gap:28px; font-weight:500; font-size:1rem; flex-wrap:wrap; align-items:center; }
        .nav-links a { color:var(--text); transition:color .2s; position:relative; cursor:pointer; text-decoration:none; }
        .nav-links a::after { content:''; position:absolute; left:0; bottom:-4px; width:0; height:2px; background:var(--accent); transition:width .25s; }
        .nav-links a:hover { color:var(--accent); }
        .nav-links a:hover::after { width:100%; }
        .nav-links .btn-link { background:var(--accent); color:#fff; padding:6px 16px; border-radius:30px; text-decoration:none; transition:background .2s; }
        .nav-links .btn-link:hover { background:var(--accent-hover); }
        .nav-links .btn-link::after { display:none; }
        .profile-card { display:flex; align-items:center; gap:30px; background:var(--card); border-radius:var(--radius); padding:32px 36px; margin:36px 0 44px; box-shadow:var(--shadow); border:1px solid var(--border); flex-wrap:wrap; }
        .avatar { flex-shrink:0; width:110px; height:110px; border-radius:50%; background:linear-gradient(135deg,#2a2a3a,#3a3a4a); display:flex; align-items:center; justify-content:center; font-size:3.2rem; color:#c0c0d0; box-shadow:0 4px 12px rgba(0,0,0,.3); user-select:none; }
        .profile-info h1 { font-size:2rem; font-weight:700; margin-bottom:4px; }
        .profile-info .bio { font-size:1.05rem; color:var(--muted); margin-bottom:14px; }
        .social-links { display:flex; flex-wrap:wrap; gap:16px; font-size:1.3rem; }
        .social-links a { color:var(--muted); transition:color .2s,transform .15s; display:inline-flex; align-items:center; gap:6px; font-size:.95rem; text-decoration:none; }
        .social-links a i { font-size:1.3rem; }
        .social-links a:hover { color:var(--accent); transform:translateY(-2px); }
        .token-settings { background:var(--card); border-radius:var(--radius); padding:20px 24px; margin-bottom:16px; border:1px solid var(--border); box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px; }
        .token-settings label { font-weight:500; color:var(--muted); display:flex; align-items:center; gap:6px; }
        .token-settings .token-row { display:flex; gap:12px; width:100%; align-items:center; flex-wrap:wrap; }
        .token-settings input { flex:1; min-width:200px; padding:8px 14px; border:1px solid var(--border); border-radius:30px; background:#2a2a2a; color:#e4e4e4; font-size:.9rem; outline:none; transition:border-color .2s; }
        .token-settings input:focus { border-color:var(--accent); }
        .token-settings .btn-sm { padding:8px 20px; background:var(--accent); color:#fff; border:none; border-radius:30px; cursor:pointer; font-weight:500; transition:background .2s; white-space:nowrap; }
        .token-settings .btn-sm:hover { background:var(--accent-hover); }
        .token-status { color:var(--muted); font-size:.9rem; }
        .token-status .valid { color:#4caf50; }
        .token-status .invalid { color:#f44336; }
        .password-settings { margin-bottom:30px; }
        .blog-motto { background:var(--card); border-radius:var(--radius); padding:28px 32px; margin-bottom:40px; border:1px solid var(--border); box-shadow:var(--shadow); text-align:center; }
        .blog-motto .motto-icon { font-size:2.4rem; color:var(--accent); margin-bottom:8px; }
        .blog-motto .motto-text { font-size:1.2rem; color:#d0d0d0; line-height:1.8; font-style:italic; }
        .blog-motto .motto-author { margin-top:8px; color:var(--muted); font-size:.95rem; }
        .publish-section { background:var(--card); border-radius:var(--radius); padding:24px 28px; margin-bottom:40px; border:1px solid var(--border); box-shadow:var(--shadow); }
        .publish-section h2 { font-size:1.3rem; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:10px; }
        .publish-section h2 i { color:var(--accent); }
        .publish-form { display:flex; flex-direction:column; gap:14px; }
        .publish-form input, .publish-form textarea, .publish-form select { font-family:inherit; font-size:1rem; padding:12px 16px; border:1px solid var(--border); border-radius:12px; background:#2a2a2a; color:#e4e4e4; transition:border .2s,box-shadow .2s; width:100%; }
        .publish-form input:focus, .publish-form textarea:focus, .publish-form select:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px rgba(74,158,255,.2); }
        .publish-form textarea { resize:vertical; min-height:90px; }
        .form-row { display:flex; gap:14px; flex-wrap:wrap; }
        .form-row input { flex:2; min-width:160px; }
        .form-row select { flex:1; min-width:120px; background:#2a2a2a; color:#e4e4e4; }
        .btn { background:var(--accent); color:#fff; border:none; padding:12px 28px; border-radius:30px; font-weight:600; font-size:1rem; cursor:pointer; transition:background .2s,transform .1s; align-self:flex-start; display:inline-flex; align-items:center; gap:8px; }
        .btn:hover { background:var(--accent-hover); transform:scale(1.01); }
        .btn:active { transform:scale(.97); }
        .section-title { font-size:1.6rem; font-weight:600; margin-bottom:24px; display:flex; align-items:center; gap:12px; }
        .section-title i { color:var(--accent); font-size:1.4rem; }
        .post-list { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:24px; }
        .post-item { background:var(--card); border-radius:var(--radius); border:1px solid var(--border); box-shadow:var(--shadow); transition:transform .25s,box-shadow .25s; overflow:hidden; cursor:pointer; }
        .post-item:hover { transform:translateY(-4px); box-shadow:0 16px 48px rgba(0,0,0,0.8); }
        .post-thumbnail { width:100%; height:180px; background:var(--border); overflow:hidden; }
        .post-thumbnail img { width:100%; height:100%; object-fit:cover; }
        .post-content { padding:16px 20px; }
        .post-title { font-size:1.2rem; font-weight:700; margin-bottom:8px; color:var(--text); transition:color .2s; }
        .post-item:hover .post-title { color:var(--accent); }
        .post-meta { font-size:.85rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:8px; }
        .post-meta .date { display:flex; align-items:center; gap:4px; }
        .post-tags { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
        .post-tags .tag { background:#2a2a2a; padding:2px 12px; border-radius:30px; font-size:.7rem; font-weight:500; color:#b0b0b0; }
        .post-excerpt { font-size:.9rem; color:#ccc; line-height:1.5; margin-bottom:8px; }
        .post-excerpt img { max-width:100%; height:auto; border-radius:8px; max-height:120px; object-fit:cover; }
        .post-actions { margin-top:12px; border-top:1px solid var(--border); padding-top:12px; display:flex; gap:12px; flex-wrap:wrap; }
        .post-actions button { background:none; border:none; font-size:.8rem; color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; gap:4px; padding:4px 8px; border-radius:20px; transition:background .2s,color .2s; }
        .post-actions button:hover { background:#2a2a2a; color:var(--accent); }
        .post-actions .delete-btn:hover { color:#ff5a5a; }
        .comment-section { margin-top:16px; padding-top:16px; border-top:1px dashed var(--border); }
        .comment-section .comment-form { display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
        .comment-section .comment-form input { flex:1; min-width:120px; padding:8px 14px; border:1px solid var(--border); border-radius:30px; font-size:.9rem; background:#2a2a2a; color:#e4e4e4; }
        .comment-section .comment-form input:focus { outline:none; border-color:var(--accent); }
        .comment-section .comment-form .btn-sm { padding:8px 20px; font-size:.85rem; border-radius:30px; background:var(--accent); color:#fff; border:none; cursor:pointer; transition:background .2s; }
        .comment-section .comment-form .btn-sm:hover { background:var(--accent-hover); }
        .comment-list { display:flex; flex-direction:column; gap:10px; }
        .comment-item { background:#2a2a2a; padding:10px 16px; border-radius:14px; font-size:.92rem; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
        .comment-item .comment-author { font-weight:600; color:var(--accent); }
        .comment-item .comment-text { flex:1; min-width:100px; color:#d0d0d0; }
        .comment-item .comment-time { font-size:.75rem; color:var(--muted); }
        .comment-item .del-comment { background:none; border:none; color:var(--muted); cursor:pointer; font-size:.8rem; padding:2px 8px; border-radius:12px; }
        .comment-item .del-comment:hover { background:#3a2a2a; color:#ff5a5a; }
        .empty-comment { color:var(--muted); font-size:.9rem; padding:6px 0; }
        .site-footer { margin-top:56px; padding-top:28px; border-top:1px solid var(--border); text-align:center; color:var(--muted); font-size:.9rem; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
        .site-footer a { color:var(--accent); text-decoration:none; }
        .site-footer a:hover { text-decoration:underline; }
        .loading-tip { text-align:center; padding:40px 0; color:var(--muted); font-size:1.1rem; }
        .refresh-btn { background:var(--accent); color:#fff; border:none; padding:6px 16px; border-radius:30px; cursor:pointer; font-size:.8rem; transition:background .2s; }
        .refresh-btn:hover { background:var(--accent-hover); }
        .post-author { font-weight:500; color:var(--accent); margin-right:8px; }
        .back-link { display:inline-block; margin-bottom:20px; color:var(--accent); text-decoration:none; font-weight:500; transition:color .2s; }
        .back-link:hover { color:var(--accent-hover); text-decoration:underline; }
        .single-post { display:none; }
        .single-post.active { display:block; }
        .post-list-container { display:block; }
        .post-list-container.hidden { display:none; }
        /* 文章详情页隐藏 */
        .hide-on-single { display:flex; flex-direction:column; }
        .single-post-active .hide-on-single { display:none !important; }
        /* 文章图片样式 */
        .post-body img { max-width:100%; height:auto; border-radius:12px; margin:12px 0; display:block; }
        .post-body img[align="center"] { margin-left:auto; margin-right:auto; }
        .post-body img:hover { transform:scale(1.02); transition:transform 0.2s; cursor:pointer; }
        @media (max-width:700px) { .profile-card { flex-direction:column; text-align:center; padding:28px 20px; } .social-links { justify-content:center; } .site-header { flex-direction:column; align-items:flex-start; } .nav-links { width:100%; justify-content:flex-start; gap:18px; } .publish-section { padding:20px; } .post-item { padding:0; } .post-content { padding:16px; } .post-list { grid-template-columns:1fr; } .site-footer { flex-direction:column; text-align:center; } .blog-motto .motto-text { font-size:1.0rem; } .token-settings { flex-direction:column; align-items:stretch; } .token-settings input { min-width:auto; } }
        @media (max-width:480px) { .container { padding:12px 0 30px; } .profile-card { padding:20px 16px; } .avatar { width:80px; height:80px; font-size:2.4rem; } .post-header { flex-direction:column; align-items:flex-start; } .blog-motto { padding:20px 16px; } .token-settings { padding:16px; } .post-thumbnail { height:140px; } }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">

        <header class="site-header">

        <!-- 在文章详情页隐藏 -->

            <section class="profile-card">

                    <h1>铜锭 (tdmc)</h1>

                    <div class="social-links">

                        <a href="https://www.luogu.com.cn/user/1969106" target="_blank"><i class="fas fa-code"></i> 洛谷</a>
                        <a href="https://www.codewars.com/users/Tong%20Ding" target="_blank"><i class="fas fa-terminal"></i> CodeWars</a>
                        <a href="http://47.105.107.184/" target="_blank"><i class="fas fa-server"></i> 我的OJ</a>

            <section class="token-settings" id="tokenSettings">

                    每篇文章都是一次对话，每个想法都值得被记录。
                </div>

        <section class="publish-section" id="publish">
            <h2><i class="fas fa-feather-alt"></i> 发布新文章</h2>
            <form class="publish-form" id="publishForm">
                <div class="form-row">
                    <input type="text" id="postTitle" placeholder="文章标题 *" required />
                    <select id="postTag">
                        <option value="技术">技术</option>

                    </select>
                </div>

                    <input type="text" id="postAuthor" placeholder="作者名称（留空则显示“匿名”）" />
                </div>

        <div id="postListContainer" class="post-list-container">
            <div class="section-title"><i class="fas fa-pen-fancy"></i> 全部文章</div>

    <script>
        const REPO_OWNER = 'tdmc123';
        const REPO_NAME = 'tdmc123.github.io';
        const FILE_PATH = 'posts.json';
        const TOKEN_STORAGE_KEY = 'github_token';
        const PASSWORD_STORAGE_KEY = 'blog_password';

        let posts = [];
        let userRole = null;
        let currentPostId = null;
        let isSaving = false;
        let dataLoaded = false;

        const container = document.getElementById('mainContainer');
        const postListEl = document.getElementById('postList');
        const postListContainer = document.getElementById('postListContainer');
        const singlePostContainer = document.getElementById('singlePostContainer');
        const singlePostContent = document.getElementById('singlePostContent');
        const backToList = document.getElementById('backToList');
        const publishForm = document.getElementById('publishForm');
        const saveBtn = document.getElementById('saveBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const tokenInput = document.getElementById('tokenInput');
        const saveTokenBtn = document.getElementById('saveTokenBtn');
        const tokenStatus = document.getElementById('tokenStatus');
        const passwordInput = document.getElementById('passwordInput');
        const savePasswordBtn = document.getElementById('savePasswordBtn');
        const passwordStatus = document.getElementById('passwordStatus');
        const roleBadge = document.getElementById('roleBadge');
        const homeLink = document.getElementById('homeLink');
        const writeLink = document.getElementById('writeLink');

        // ===== 核心修改：支持图片和链接解析 =====
        function parseContent(text) {
            if (!text) return '';
            
            // 1. 先处理图片语法 ![alt](url)
            let result = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, function(match, alt, url) {
                return `<img src="${url}" alt="${alt || '图片'}" style="max-width:100%; border-radius:12px; margin:12px 0; display:block;" loading="lazy" />`;
            });
            
            // 2. 再处理普通链接 [text](url)，检查是否指向图片
            result = result.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(match, textContent, url) {
                // 检查是否为图片链接：以常见图片格式结尾，或包含 image_hosting
                if (url.match(/\.(png|jpg|jpeg|gif|webp|svg|bmp|ico)(\?.*)?$/i) || url.includes('image_hosting')) {
                    return `<img src="${url}" alt="${textContent}" style="max-width:100%; border-radius:12px; margin:12px 0; display:block;" loading="lazy" />`;
                }
                // 普通链接
                return `<a href="${url}" target="_blank" style="color:var(--accent); text-decoration:underline;">${textContent}</a>`;
            });
            
            return result;
        }

        function getStoredToken() { return localStorage.getItem(TOKEN_STORAGE_KEY) || ''; }
        function saveTokenToStorage(token) { localStorage.setItem(TOKEN_STORAGE_KEY, token); }
        function isValidToken(token) { return token && token.startsWith('ghp_') && token.length > 10; }

        function updateTokenStatus() {
            const token = getStoredToken();
            if (isValidToken(token)) {
                tokenStatus.innerHTML = `✅ 已设置 Token (${token.slice(0, 8)}...)`;
                tokenStatus.className = 'token-status valid';
            } else if (token) {
                tokenStatus.innerHTML = '⚠️ Token 格式无效 (应以 ghp_ 开头)';
                tokenStatus.className = 'token-status invalid';
            } else {
                tokenStatus.innerHTML = '⚪ 未设置 Token';
                tokenStatus.className = 'token-status';
            }
            tokenInput.value = token;
        }

        function getStoredPassword() { return localStorage.getItem(PASSWORD_STORAGE_KEY) || ''; }
        function savePasswordToStorage(pwd) { localStorage.setItem(PASSWORD_STORAGE_KEY, pwd); }
        function verifyPassword(pwd) {
            if (pwd === '258088') return 'admin';
            if (pwd === '123456') return 'guest';
            return null;
        }

        function updateRoleUIOnly(role) {
            userRole = role;
            if (role === 'admin') {
                roleBadge.textContent = '👑 管理员';
                roleBadge.style.background = '#4caf50';
                passwordStatus.innerHTML = '✅ 管理员';
                passwordStatus.className = 'token-status valid';
            } else if (role === 'guest') {
                roleBadge.textContent = '👤 访客';
                roleBadge.style.background = '#555';
                passwordStatus.innerHTML = '✅ 访客';
                passwordStatus.className = 'token-status valid';
            } else {
                roleBadge.textContent = '🔒 未验证';
                roleBadge.style.background = '#888';
                passwordStatus.innerHTML = '⚪ 未输入密码';
                passwordStatus.className = 'token-status';
            }
        }

        function updateRoleUI(role) {
            updateRoleUIOnly(role);
            if (dataLoaded) {
                renderView();
            }
        }

        function initPassword() {
            const storedPwd = getStoredPassword();
            if (storedPwd) {
                const role = verifyPassword(storedPwd);
                if (role) {
                    updateRoleUIOnly(role);
                    passwordInput.value = storedPwd;
                    return;
                } else {
                    localStorage.removeItem(PASSWORD_STORAGE_KEY);
                }
            }
            updateRoleUIOnly(null);
            passwordInput.value = '';
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function formatTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleString('zh-CN', { hour12: false });
        }

        function genId() { return Date.now() + Math.floor(Math.random() * 1000000); }

        function base64Encode(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            let binary = '';
            data.forEach(byte => binary += String.fromCharCode(byte));
            return btoa(binary);
        }

        function base64Decode(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            const decoder = new TextDecoder('utf-8');
            return decoder.decode(bytes);
        }

        async function fetchPostsFromAPI(token) {
            const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
            const res = await fetch(url, {
                headers: {
                    'Authorization': `token ${token}`,
                    'Accept': 'application/vnd.github.v3+json'
                }
            });
            if (res.status === 404) return [];
            if (!res.ok) {
                const err = await res.text();
                throw new Error(`获取数据失败 (${res.status}): ${err}`);
            }
            const data = await res.json();
            const content = base64Decode(data.content);
            const parsed = JSON.parse(content);
            if (!Array.isArray(parsed)) throw new Error('数据格式无效');
            return parsed;
        }

        async function savePostsToGitHub(dataToSave, rollbackData) {
            if (isSaving) {
                alert('⏳ 正在保存中，请稍后再试');
                return false;
            }
            const token = getStoredToken();
            if (!isValidToken(token)) {
                alert('请先设置有效的 GitHub Token（在页面上方输入框）');
                return false;
            }
            try { JSON.stringify(dataToSave); } catch (e) { alert('数据格式错误，无法保存'); return false; }

            isSaving = true;
            const content = JSON.stringify(dataToSave, null, 2);
            const encodedContent = base64Encode(content);

            try {
                console.log('🔄 正在保存数据到 GitHub...');
                const getUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
                const getRes = await fetch(getUrl, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                let sha = null;
                if (getRes.ok) {
                    const fileData = await getRes.json();
                    sha = fileData.sha;
                } else if (getRes.status !== 404) {
                    const errorText = await getRes.text();
                    throw new Error(`获取文件信息失败 (HTTP ${getRes.status}): ${errorText}`);
                }
                const putUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
                const putBody = {
                    message: '更新 posts.json (通过博客保存)',
                    content: encodedContent,
                    branch: 'main'
                };
                if (sha) putBody.sha = sha;
                const putRes = await fetch(putUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(putBody)
                });
                if (!putRes.ok) {
                    const errorData = await putRes.json();
                    throw new Error(errorData.message || '更新文件失败');
                }
                console.log('✅ 保存成功');
                const freshData = await fetchPostsFromAPI(token);
                posts = freshData;
                dataLoaded = true;
                renderView();
                alert('✅ 操作已成功保存到 GitHub！');
                return true;
            } catch (err) {
                console.error('❌ 保存失败:', err);
                if (rollbackData !== undefined) {
                    posts = rollbackData;
                    renderView();
                    alert('❌ 保存失败，已回滚到操作前状态：' + err.message);
                } else {
                    alert('❌ 保存失败：' + err.message);
                }
                return false;
            } finally {
                isSaving = false;
            }
        }

        async function loadData() {
            const token = getStoredToken();
            if (!isValidToken(token)) {
                postListEl.innerHTML = `
                    <div style="text-align:center; padding:40px 20px; background:#2a1a1a; border:2px solid #ff9800; border-radius:12px; color:#ff9800;">
                        <i class="fas fa-key" style="font-size:2.5rem; display:block; margin-bottom:12px;"></i>
                        <strong>请先在上方输入有效的 GitHub Token</strong>
                        <p style="font-size:0.9rem; color:#aaa; margin-top:8px;">Token 用于同步文章和评论到你的 GitHub 仓库</p>
                    </div>
                `;
                posts = [];
                dataLoaded = true;
                return;
            }

            postListEl.innerHTML = `<div class="loading-tip"><i class="fas fa-spinner fa-spin"></i> 加载文章中...</div>`;

            try {
                const data = await fetchPostsFromAPI(token);
                if (Array.isArray(data)) {
                    posts = data;
                    dataLoaded = true;
                    console.log('✅ 数据加载成功，共', posts.length, '篇文章');
                    handleViewAfterLoad();
                    return;
                } else {
                    throw new Error('数据格式无效');
                }
            } catch (err) {
                console.error('加载失败:', err);
                postListEl.innerHTML = `
                    <div style="text-align:center; padding:40px 20px; color:var(--muted);">
                        <i class="fas fa-exclamation-triangle" style="font-size:2rem; display:block; margin-bottom:12px; color:#ff9800;"></i>
                        <strong>加载数据失败</strong>
                        <p style="font-size:0.9rem; margin-top:8px;">${escapeHtml(err.message)}</p>
                        <p style="font-size:0.85rem; margin-top:4px; color:#666;">请检查网络连接或 Token 是否有效，然后点击“刷新”重试</p>
                    </div>
                `;
                posts = [];
                dataLoaded = true;
            }
        }

        function handleViewAfterLoad() {
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('post');
            if (postId) {
                console.log('🔍 数据加载完成后检测到 post 参数:', postId);
                showSinglePost(postId);
            } else {
                showList();
            }
        }

        function renderView() {
            if (!dataLoaded) {
                console.log('⏳ 数据尚未加载，跳过 renderView');
                return;
            }
            const params = new URLSearchParams(window.location.search);
            const postId = params.get('post');
            if (postId) {
                showSinglePost(postId);
            } else {
                showList();
            }
        }

        function showList() {
            console.log('📋 显示文章列表');
            container.classList.remove('single-post-active');
            postListContainer.style.display = 'block';
            singlePostContainer.classList.remove('active');
            singlePostContainer.style.display = 'none';
            document.getElementById('publish').style.display = 'block';
            renderPosts(posts);
            if (window.location.search) {
                const url = window.location.pathname;
                window.history.replaceState({}, '', url);
            }
        }

        function showSinglePost(id) {
            const idStr = String(id);
            const post = posts.find(p => String(p.id) === idStr);
            if (!post) {
                alert('文章不存在');
                showList();
                return;
            }
            container.classList.add('single-post-active');
            postListContainer.style.display = 'none';
            singlePostContainer.style.display = 'block';
            singlePostContainer.classList.add('active');
            document.getElementById('publish').style.display = 'none';
            renderSinglePost(post);
            if (window.location.search !== `?post=${idStr}`) {
                window.history.pushState({}, '', `?post=${idStr}`);
            }
            currentPostId = post.id;
        }

        function renderPosts(postsData) {
            if (!postsData || postsData.length === 0) {
                postListEl.innerHTML = `
                    <div style="text-align:center; padding:40px 0; color:var(--muted); grid-column:1/-1;">
                        <i class="fas fa-inbox" style="font-size:2rem; display:block; margin-bottom:12px;"></i>
                        还没有文章，发布第一篇吧！
                    </div>
                `;
                return;
            }

            const sorted = [...postsData].sort((a, b) => new Date(b.date) - new Date(a.date));

            let html = '';
            sorted.forEach(post => {
                if (!post.id) post.id = genId();
                const author = post.author ? escapeHtml(post.author) : '匿名';
                const comments = post.comments || [];
                const excerpt = post.content.substring(0, 120) + (post.content.length > 120 ? '...' : '');
                const parsedExcerpt = parseContent(escapeHtml(excerpt));
                const imgId = post.id % 1000;
                const imgUrl = `https://picsum.photos/seed/${imgId}/400/200`;
                const deleteBtnHtml = (userRole === 'admin') ?
                    `<button class="delete-post-btn" data-id="${String(post.id)}"><i class="fas fa-trash-alt"></i> 删除</button>` :
                    '';

                html += `
                    <div class="post-item" data-postid="${String(post.id)}">
                        <div class="post-thumbnail">
                            <img src="${imgUrl}" alt="${escapeHtml(post.title)}" loading="lazy" onerror="this.style.display='none'" />
                        </div>
                        <div class="post-content">
                            <h3 class="post-title">${escapeHtml(post.title)}</h3>
                            <div class="post-meta">
                                <span class="date"><i class="far fa-calendar-alt"></i> ${post.date}</span>
                                <span class="post-author"><i class="fas fa-user"></i> ${author}</span>
                                <span><i class="far fa-comment"></i> ${comments.length} 条评论</span>
                            </div>
                            <div class="post-tags">
                                <span class="tag">${escapeHtml(post.tag)}</span>
                            </div>
                            <div class="post-excerpt">${parsedExcerpt}</div>
                            <div class="post-actions">
                                ${deleteBtnHtml}
                            </div>
                        </div>
                    </div>
                `;
            });
            postListEl.innerHTML = html;
        }

        function renderSinglePost(post) {
            const author = post.author ? escapeHtml(post.author) : '匿名';
            const comments = post.comments || [];
            const parsedContent = parseContent(escapeHtml(post.content));

            let commentsHtml = comments.length === 0 ?
                `<div class="empty-comment">还没有评论，来说点什么吧</div>` :
                comments.map((c, idx) => {
                    const delBtn = (userRole === 'admin') ?
                        `<button class="del-comment" title="删除评论"><i class="fas fa-times"></i></button>` :
                        '';
                    return `
                        <div class="comment-item" data-postid="${String(post.id)}" data-commentidx="${idx}">
                            <span class="comment-author">${escapeHtml(c.author)}</span>
                            <span class="comment-text">${escapeHtml(c.text)}</span>
                            <span class="comment-time">${formatTime(c.time)}</span>
                            ${delBtn}
                        </div>
                    `;
                }).join('');

            const commentFormHtml = `
                <div class="comment-form" data-postid="${String(post.id)}">
                    <input type="text" placeholder="你的昵称" class="comment-author-input" value="访客" />
                    <input type="text" placeholder="说点什么…" class="comment-text-input" />
                    <button class="btn-sm comment-submit">评论</button>
                </div>
            `;

            const deletePostBtn = (userRole === 'admin') ?
                `<button class="delete-post-btn" data-id="${String(post.id)}"><i class="fas fa-trash-alt"></i> 删除文章</button>` :
                '';

            singlePostContent.innerHTML = `
                <div class="post-header" style="padding:0 0 16px 0;">
                    <h1 class="post-title" style="font-size:1.8rem;">${escapeHtml(post.title)}</h1>
                    <span class="post-tags"><span class="tag">${escapeHtml(post.tag)}</span></span>
                </div>
                <div class="post-meta" style="padding:0 0 12px 0;">
                    <span class="date"><i class="far fa-calendar-alt"></i> ${post.date}</span>
                    <span class="post-author"><i class="fas fa-user"></i> ${author}</span>
                    <span><i class="far fa-comment"></i> ${comments.length} 条评论</span>
                </div>
                <div class="post-body" style="font-size:1.1rem; line-height:1.8; padding:0 0 16px 0;">${parsedContent}</div>
                <div class="post-actions" style="border-top:1px solid var(--border); padding-top:16px; margin-top:8px;">
                    ${deletePostBtn}
                </div>
                <div class="comment-section" style="margin-top:20px;">
                    ${commentFormHtml}
                    <div class="comment-list">
                        ${commentsHtml}
                    </div>
                </div>
            `;
        }

        // ---------- 事件监听 ----------
        document.addEventListener('click', function(e) {
            const item = e.target.closest('.post-item');
            if (item) {
                if (e.target.closest('.delete-post-btn')) return;
                const id = item.getAttribute('data-postid') || item.dataset.postid;
                if (id) {
                    window.location.href = '?post=' + id;
                }
            }
        });

        document.addEventListener('click', function(e) {
            const delBtn = e.target.closest('.delete-post-btn');
            if (delBtn) {
                if (userRole !== 'admin') { alert('⚠️ 权限不足'); return; }
                const id = delBtn.dataset.id;
                if (!id) return;
                if (!confirm('确定要删除这篇文章吗？')) return;
                const oldPosts = JSON.parse(JSON.stringify(posts));
                const newPosts = posts.filter(p => String(p.id) !== id);
                savePostsToGitHub(newPosts, oldPosts).then(() => renderView());
            }
        });

        document.addEventListener('click', function(e) {
            const delCommentBtn = e.target.closest('.del-comment');
            if (delCommentBtn) {
                if (userRole !== 'admin') { alert('⚠️ 权限不足'); return; }
                const commentItem = delCommentBtn.closest('.comment-item');
                if (!commentItem) return;
                const postId = commentItem.dataset.postid;
                const idx = Number(commentItem.dataset.commentidx);
                if (!postId || isNaN(idx)) return;
                if (!confirm('删除这条评论？')) return;
                const oldPosts = JSON.parse(JSON.stringify(posts));
                const post = posts.find(p => String(p.id) === postId);
                if (post && post.comments && post.comments.length > idx) {
                    post.comments.splice(idx, 1);
                    savePostsToGitHub(posts, oldPosts).then(() => renderView());
                }
            }
        });

        document.addEventListener('click', function(e) {
            const submitBtn = e.target.closest('.comment-submit');
            if (submitBtn) {
                const form = submitBtn.closest('.comment-form');
                if (!form) return;
                const postId = form.dataset.postid;
                if (!postId) return;
                const authorInput = form.querySelector('.comment-author-input');
                const textInput = form.querySelector('.comment-text-input');
                const author = authorInput.value.trim() || '匿名';
                const text = textInput.value.trim();
                if (!text) { alert('评论内容不能为空'); return; }
                const oldPosts = JSON.parse(JSON.stringify(posts));
                const post = posts.find(p => String(p.id) === postId);
                if (!post) { alert('文章不存在'); return; }
                if (!post.comments) post.comments = [];
                post.comments.push({ author, text, time: new Date().toISOString() });
                savePostsToGitHub(posts, oldPosts).then(() => renderView());
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const input = e.target.closest('.comment-text-input');
                if (input) {
                    e.preventDefault();
                    const form = input.closest('.comment-form');
                    if (form) {
                        const submitBtn = form.querySelector('.comment-submit');
                        if (submitBtn) submitBtn.click();
                    }
                }
            }
        });

        // ---------- 发布文章 ----------
        publishForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const tag = document.getElementById('postTag').value;
            const author = document.getElementById('postAuthor').value.trim() || '匿名';
            
            if (!title || !content) {
                alert('标题和内容都不能为空');
                return;
            }
            
            const oldPosts = JSON.parse(JSON.stringify(posts));
            const newPost = {
                id: genId(),
                title: title,
                content: content,
                tag: tag,
                author: author,
                date: new Date().toISOString().slice(0, 10),
                comments: []
            };
            
            posts.push(newPost);
            savePostsToGitHub(posts, oldPosts).then(() => {
                renderView();
                document.getElementById('postTitle').value = '';
                document.getElementById('postContent').value = '';
                document.getElementById('postAuthor').value = '';
            });
        });

        // ---------- 导航 ----------
        homeLink.addEventListener('click', function(e) {
            e.preventDefault();
            showList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        backToList.addEventListener('click', function(e) {
            e.preventDefault();
            showList();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        writeLink.addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('publish').scrollIntoView({ behavior: 'smooth' });
        });

        saveBtn.addEventListener('click', function() {
            if (posts.length === 0) { alert('暂无数据可保存'); return; }
            savePostsToGitHub(posts);
        });

        refreshBtn.addEventListener('click', function() {
            loadData();
        });

        saveTokenBtn.addEventListener('click', function() {
            const token = tokenInput.value.trim();
            if (!token) { alert('请输入 Token'); return; }
            if (!isValidToken(token)) { alert('Token 格式不正确'); return; }
            saveTokenToStorage(token);
            updateTokenStatus();
            alert('✅ Token 已保存！');
            loadData();
        });

        savePasswordBtn.addEventListener('click', function() {
            const pwd = passwordInput.value.trim();
            if (!pwd) { alert('请输入密码'); return; }
            const role = verifyPassword(pwd);
            if (!role) {
                passwordStatus.innerHTML = '❌ 密码错误';
                passwordStatus.className = 'token-status invalid';
                return;
            }
            savePasswordToStorage(pwd);
            updateRoleUI(role);
            alert('✅ 身份验证成功！当前角色：' + (role === 'admin' ? '管理员' : '访客'));
        });

        window.addEventListener('popstate', function() {
            renderView();
        });

        // ---------- 初始化 ----------
        console.log('🚀 博客初始化开始...');
        updateTokenStatus();
        initPassword();
        loadData();
    </script>

</body>
</html>
