<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>铜锭的博客</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* 样式与之前完全相同，省略以节省篇幅，实际使用时请保留完整样式 */
        /* 此处省略样式，但实际完整代码中应包含所有样式 */
    </style>
</head>
<body>
    <!-- 头部、个人信息等保持不变，仅修改密码输入框及状态显示 -->
    <!-- ... -->
    <section class="token-settings" id="passwordSettings">
        <label for="passwordInput"><i class="fas fa-lock"></i> 密码</label>
        <input type="password" id="passwordInput" placeholder="请输入密码" />
        <button class="btn-sm" id="savePasswordBtn">验证密码</button>
        <span class="token-status" id="passwordStatus">⚪ 未验证</span>
    </section>
    <!-- ... -->
    <script>
        (function() {
            'use strict';
            // ... 其他代码不变 ...
            // 密码验证逻辑不变
            function updatePasswordStatus() {
                const stored = getStoredPassword();
                const role = verifyPassword(stored);
                if (role === 'admin') {
                    passwordStatus.innerHTML = '✅ 管理员';
                    passwordStatus.className = 'token-status valid';
                    roleBadge.textContent = '👑 管理员';
                    roleBadge.className = 'permission-badge admin';
                    isAdmin = true;
                } else if (role === 'guest') {
                    passwordStatus.innerHTML = '✅ 访客';
                    passwordStatus.className = 'token-status';
                    roleBadge.textContent = '👤 访客';
                    roleBadge.className = 'permission-badge guest';
                    isAdmin = false;
                } else {
                    passwordStatus.innerHTML = '❌ 密码错误';
                    passwordStatus.className = 'token-status invalid';
                    roleBadge.textContent = '⚪ 未验证';
                    roleBadge.className = 'permission-badge';
                    isAdmin = false;
                }
                passwordInput.value = stored;
            }
            // ... 其余代码不变 ...
        })();
    </script>
</body>
</html>
